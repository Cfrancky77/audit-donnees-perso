name: AppImage

on:
  push:
    tags: ["v*"]        # git tag v0.1.0 && git push origin v0.1.0 -> publie une release
  pull_request:
  workflow_dispatch:    # construction manuelle (onglet Actions), sans release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: python-appimage
        run: pip install python-appimage==1.4.7

      - name: Construction
        run: scripts/build_appimage.sh

      - name: Tests rapides
        run: scripts/smoke_test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: osint-audit-AppImage
          path: |
            osint-audit-x86_64.AppImage
            osint-audit-x86_64.AppImage.sha256
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: osint-audit-AppImage
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            osint-audit-x86_64.AppImage osint-audit-x86_64.AppImage.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
