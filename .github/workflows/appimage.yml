name: AppImage

# PR / lancement manuel : construit et teste l'AppImage (artefact), sans release.
# Push sur main : idem, puis signe l'AppImage (Ed25519, pour le lanceur FCDI Apps)
# et la publie dans la release v0.1.<numéro d'exécution>, avec son .sig.
on:
  push:
    branches: [main]
    # Pas de nouvelle release pour un simple changement de documentation.
    paths-ignore: ['README.md', 'SECURITY.md', 'docs/**', 'LICENSE', '.github/CODEOWNERS', '.github/dependabot.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: python-appimage
        run: pip install python-appimage==1.4.7

      - name: Construction
        run: scripts/build_appimage.sh

      - name: Tests rapides
        run: scripts/smoke_test.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: audit-donnees-perso-AppImage
          path: |
            audit-donnees-perso-x86_64.AppImage
            audit-donnees-perso-x86_64.AppImage.sha256
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Dépendances
        shell: bash
        run: pip install -r appimage/requirements.txt pyinstaller==6.22.3

      - name: Construction de l'exécutable
        shell: bash
        run: windows/build_exe.sh

      - name: Tests rapides
        shell: bash
        run: windows/smoke_test.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: audit-donnees-perso-windows
          path: |
            dist/audit-donnees-perso-windows-x86_64.exe
            dist/audit-donnees-perso-windows-x86_64.exe.sha256
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # créer la release
      actions: read     # télécharger l'artefact du job build
    env:
      APP_ID: audit-donnees-perso
      FILE: audit-donnees-perso-x86_64.AppImage
      TAG: v0.1.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # gh run download plutôt que actions/download-artifact : une action tierce de moins.
      - name: Récupérer l'AppImage du job build
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n audit-donnees-perso-AppImage -D .
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n audit-donnees-perso-windows -D .

      # Clé privée dans le secret FCDI_SIGNING_KEY (contenu du .pem).
      # Le message signé lie l'application, la version, le nom du fichier et son empreinte
      # (même format que FCDI-Apps/tools/sign.sh et src/verify.rs).
      - name: Signature pour FCDI Apps
        env:
          FCDI_SIGNING_KEY: ${{ secrets.FCDI_SIGNING_KEY }}
        run: |
          if [ -z "$FCDI_SIGNING_KEY" ]; then
            echo "::error::Secret FCDI_SIGNING_KEY absent : ajoutez-le (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          KEYFILE="$(mktemp)"; MSG="$(mktemp)"
          trap 'rm -f "$KEYFILE" "$MSG"' EXIT
          printf '%s\n' "$FCDI_SIGNING_KEY" > "$KEYFILE"
          SHA="$(sha256sum "$FILE" | cut -d' ' -f1)"
          printf 'FCDI-Apps signature v1\n%s\n%s\n%s\n%s\n' "$APP_ID" "$TAG" "$FILE" "$SHA" > "$MSG"
          openssl pkeyutl -sign -rawin -inkey "$KEYFILE" -in "$MSG" | base64 -w0 > "$FILE.sig"
          test -s "$FILE.sig"

      - name: Publier la release
        run: |
          gh release create "$TAG" "$FILE" "$FILE.sig" "$FILE.sha256" \
            audit-donnees-perso-windows-x86_64.exe audit-donnees-perso-windows-x86_64.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
