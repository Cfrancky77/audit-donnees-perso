name: AppImage

on:
  push:
    tags: ["v*"]        # git tag v0.1.0 && git push origin v0.1.0 -> publie une release
  pull_request:
  workflow_dispatch:    # construction manuelle (onglet Actions), sans release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: python-appimage
        run: pip install python-appimage==1.4.7

      - name: Construction
        run: scripts/build_appimage.sh

      - name: Tests rapides
        run: scripts/smoke_test.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: audit-donnees-perso-AppImage
          path: |
            audit-donnees-perso-x86_64.AppImage
            audit-donnees-perso-x86_64.AppImage.sha256
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # TODO : épingler sur un hash (non résolu : ce job n'a pas encore tourné)
      - uses: actions/download-artifact@v4
        with:
          name: audit-donnees-perso-AppImage
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            audit-donnees-perso-x86_64.AppImage audit-donnees-perso-x86_64.AppImage.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
